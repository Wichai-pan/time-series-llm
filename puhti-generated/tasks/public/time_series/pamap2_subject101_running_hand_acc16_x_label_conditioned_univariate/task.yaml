######################################################
#                   MANDATORY FIELDS
######################################################
task_name: time_series/pamap2_subject101_running_hand_acc16_x_label_conditioned_univariate
task_description: Label-conditioned univariate SDForger baseline on PAMAP2 subject101 running hand_acc16_x.
created_by: Codex label-conditioning v1

data_builder: time_series

######################################################
#                   RESERVED FIELDS
######################################################
data:
  type: default
  data_path: ${DGT_DATA_DIR}/public/time_series/pamap2_subject101_running_hand_acc16_x.parquet

######################################################
#                   TASK FIELDS
######################################################
data_params:
  train_length: 5000
  train_samples: 1
  augmentation_strategy: univariate
  train_channels:
    - hand_acc16_x

sdforger_params:
  k_bit: null
  min_outputs_to_generate: 50
  max_outputs_to_generate: 100
  inference_batch: 64
  norms_diversity_threshold: 1
  embedding_type: "fica"
  embedding_dim: auto
  variance_explained: 0.7
  min_windows_number: 30
  min_windows_length: 300
  input_tokens_precision: 4
  text_template: fim_template_textual_encoding
  conditioning_label_column: data
  conditioning_label_value: running
